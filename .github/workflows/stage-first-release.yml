# One-time staging of the first release; publishing remains an explicit separate step.
name: Stage FT Music v0.3.0

on:
  push:
    branches: [arena/f3e1b3c5-ft-music]
    paths: [.github/workflows/stage-first-release.yml]

permissions:
  contents: write

jobs:
  stage:
    if: github.repository == 'ft-sinan/FT-music-'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Install Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Test and build Android
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - name: Decrypt and sign the release
        env:
          FT_MUSIC_KEY_PASSPHRASE: ${{ secrets.FT_MUSIC_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          [[ "$(python3 android/scripts/release-version.py)" == '0.3.0' ]] || { echo 'Unexpected initial release version' >&2; exit 1; }
          umask 077
          KEY_DIR=$(mktemp -d "$RUNNER_TEMP/ft-signing.XXXXXXXX")
          trap 'rm -rf "$KEY_DIR"' EXIT
          android/scripts/unseal-signing.sh "$KEY_DIR"
          android/scripts/sign-release.sh "$KEY_DIR/temp-key.pk8" "$KEY_DIR/temp-cert.der" "$RUNNER_TEMP/ft-release"
      - name: Attach the verified APK to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload v0.3.0 "$RUNNER_TEMP/ft-release/FT-Music-v0.3.0.apk" --repo "$GITHUB_REPOSITORY"
          gh release edit v0.3.0 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --notes-file .github/release-notes.md
