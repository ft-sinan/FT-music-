name: Android build verification

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Install Android SDK and native tools
        run: |
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1" 2>&1 | tee "$RUNNER_TEMP/ft-sdk.log"
      - name: Check FT fork configuration and release version
        run: |
          python3 android/tests/ForkConfigurationTest.py
          python3 android/tests/ReleaseVersionTest.py
      - name: Test and build the universal Android app
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testUniversalGmsDebugUnitTest assembleUniversalGmsRelease 2>&1 | tee "$RUNNER_TEMP/ft-gradle.log"
      - name: Summarize a build failure
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          temp = Path(os.environ['RUNNER_TEMP'])
          log = temp / 'ft-gradle.log'
          if not log.exists(): log = temp / 'ft-sdk.log'
          if log.exists():
              text = re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', log.read_text(errors='replace'))
              start = max(text.rfind('FAILURE:'), text.rfind('* What went wrong:'))
              text = text[start:] if start >= 0 else text[-7000:]
              text = text[:7000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Android build failure::' + text)
          PY
      - name: Inspect unsigned APK
        run: |
          set -euo pipefail
          mapfile -t APK_FILES < <(find android/app/build/outputs/apk/universalGms/release -maxdepth 1 -name '*-unsigned.apk' -type f)
          [[ ${#APK_FILES[@]} == 1 ]] || { echo 'Expected exactly one unsigned universal GMS APK.' >&2; exit 1; }
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "${APK_FILES[0]}")
          VERSION=$(python3 android/scripts/release-version.py)
          CODE=$(python3 android/scripts/release-version.py --code-only)
          [[ "$BADGING" == *"name='com.ftmusic.app'"* && "$BADGING" == *"versionCode='$CODE'"* && "$BADGING" == *"versionName='$VERSION'"* && "$BADGING" == *"application-label:'FT Music'"* ]]
          MANIFEST=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "${APK_FILES[0]}" AndroidManifest.xml)
          [[ "$MANIFEST" != *"com.google.android.gms.car.application"* && "$MANIFEST" != *"android.media.browse.MediaBrowserService"* ]] || { echo 'Android Auto integration unexpectedly present.' >&2; exit 1; }
          echo "Verified com.ftmusic.app $VERSION ($CODE), FT branding, and no Android Auto discovery"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ft-music-unsigned-apk
          path: android/app/build/outputs/apk/universalGms/release/*-unsigned.apk
          if-no-files-found: error
          retention-days: 7
