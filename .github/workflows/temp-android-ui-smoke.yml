name: Temporary Android UI smoke
on:
  push:
    branches:
      - arena/e3718f56-ft-music
permissions:
  contents: write
  actions: read
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Capture previous failed run log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view 41032548133 --repo "$GITHUB_REPOSITORY" --log-failed > "$RUNNER_TEMP/previous-ui.log"
          python3 - "$RUNNER_TEMP/previous-ui.log" > "$RUNNER_TEMP/previous-blob.json" <<'PY'
          import base64, json, sys
          with open(sys.argv[1], 'rb') as data:
              json.dump({'content': base64.b64encode(data.read()).decode(), 'encoding': 'base64'}, sys.stdout)
          PY
          sha=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input "$RUNNER_TEMP/previous-blob.json" --jq .sha)
          echo "::notice title=FT_UI_PREVIOUS_LOG::$sha"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Install Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run emulator smoke checks
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          ANDROID_UI_OUTPUT: ${{ runner.temp }}/ft-ui
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash -o pipefail -c 'python3 android/tests/UiSmoke.py 2>&1 | tee "$RUNNER_TEMP/ft-ui-log.txt"'
      - name: Store temporary screenshot objects for review
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for screenshot in "$RUNNER_TEMP"/ft-ui/*.png "$RUNNER_TEMP"/ft-ui/*.xml "$RUNNER_TEMP"/ft-ui/*.txt "$RUNNER_TEMP"/ft-ui-log.txt; do
            [[ -f "$screenshot" ]] || continue
            name=$(basename "$screenshot" | tr '[:lower:].-' '[:upper:]__')
            python3 - "$screenshot" > "$RUNNER_TEMP/blob.json" <<'PY'
          import base64, json, sys
          with open(sys.argv[1], 'rb') as image:
              json.dump({'content': base64.b64encode(image.read()).decode(), 'encoding': 'base64'}, sys.stdout)
          PY
            sha=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input "$RUNNER_TEMP/blob.json" --jq .sha)
            echo "::notice title=FT_UI_$name::$sha"
          done
