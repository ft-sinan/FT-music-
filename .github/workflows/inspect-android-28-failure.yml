name: Inspect prior Android 9 test failure

on:
  push:
    paths:
      - '.github/workflows/inspect-android-28-failure.yml'

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download the prior Android 9 logs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: 42051700665
          name: ft-feature-emulator-28
          path: diagnostics
      - name: Summarize the prior test output
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('diagnostics')
          def annotate(title, text):
              text = text[-3000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::warning title={title}::{text}')
          for name in ('instrumentation.log', 'local-delete-smoke.log'):
              path = next(root.rglob(name), None)
              if path is None:
                  annotate(name, 'File not present in the artifact')
                  continue
              text = path.read_text(errors='replace')
              lines = text.splitlines()
              hits = [i for i, line in enumerate(lines) if re.search(
                  r'INSTRUMENTATION_(FAILED|RESULT)|STATUS_CODE: -[1-9]|FAILURES!!!|FATAL EXCEPTION|Process crashed|Process died|timed out|Exception', line, re.I)]
              excerpts = '\n'.join('\n'.join(lines[max(0, i-4):min(len(lines), i+8)]) for i in hits[-4:])
              annotate(name + ' failure markers', excerpts or 'No failure marker found')
              annotate(name + ' tail', '\n'.join(lines[-40:]))
          PY
