# One-time staging of the approved v0.4.0 pre-release. Remove after the draft is verified.
name: Stage FT Music v0.4.0

on:
  push:
    branches: [arena/e3718f56-ft-music]
    paths: [.github/workflows/stage-v0-4.yml]

permissions:
  contents: write

jobs:
  stage:
    if: github.repository == 'ft-sinan/FT-music-'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Check version and existing draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == false) | .tag_name' > "$RUNNER_TEMP/ft-published-tags.txt"
          [[ "$(python3 android/scripts/release-version.py --existing-tags "$RUNNER_TEMP/ft-published-tags.txt")" == '0.4.0' ]] || { echo 'Unexpected release version.' >&2; exit 1; }
          [[ -z "$(git ls-remote --tags origin refs/tags/v0.4.0)" ]] || { echo 'The release tag already exists.' >&2; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/releases/428865654" --jq 'select(.tag_name == "v0.4.0" and .draft == true and (.assets | length) == 0) | .id' | grep -qx 428865654
      - name: Install Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Test and build Android
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - name: Decrypt and sign with the existing FT Music key
        env:
          FT_MUSIC_KEY_PASSPHRASE: ${{ secrets.FT_MUSIC_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          KEY_DIR=$(mktemp -d "$RUNNER_TEMP/ft-signing.XXXXXXXX")
          trap 'rm -rf "$KEY_DIR"' EXIT
          android/scripts/unseal-signing.sh "$KEY_DIR"
          android/scripts/sign-release.sh "$KEY_DIR/temp-key.pk8" "$KEY_DIR/temp-cert.der" "$RUNNER_TEMP/ft-release"
      - name: Attach the verified APK to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/428865654" --jq 'select(.tag_name == "v0.4.0" and .draft == true and (.assets | length) == 0) | .id' | grep -qx 428865654
          gh release upload v0.4.0 "$RUNNER_TEMP/ft-release/FT-Music-v0.4.0.apk" --repo "$GITHUB_REPOSITORY"
          gh release edit v0.4.0 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --notes-file .github/release-notes.md
