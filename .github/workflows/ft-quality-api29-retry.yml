name: FT download quality API 29 retry

on:
  push:
    paths:
      - '.github/workflows/ft-quality-api29-retry.yml'

permissions:
  contents: read
  actions: read

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ft-debug-and-test-apks
          path: ${{ runner.temp }}/ft-apks
          run-id: '41633768958'
          github-token: ${{ github.token }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Retry Android 10 tests with the same final-commit APKs
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          FT_TEST_API: 29
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash android/tests/run-feature-emulator.sh
      - name: Summarize an emulator failure
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ['RUNNER_TEMP'])
          text = '\n'.join((root / name).read_text(errors='replace')[-5000:]
                           for name in ('instrumentation.log', 'local-delete-smoke.log') if (root / name).exists())
          if text:
              print('::error title=API 29 retry failed::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          else:
              print('::error title=API 29 retry failed::The emulator failed before the test script wrote logs.')
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: ft-quality-api29-retry-results
          path: |
            ${{ runner.temp }}/instrumentation.log
            ${{ runner.temp }}/local-delete-smoke.log
            ${{ runner.temp }}/ft-local-delete-ui/
          if-no-files-found: ignore
          retention-days: 7
