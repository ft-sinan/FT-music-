name: Android shared download checks

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-feature-checks.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-feature-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-feature-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Install Android SDK and native tools
        run: |
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Create disposable Android debug key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" \
            -storetype JKS -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
      - name: Build debug app and instrumentation tests
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleUniversalGmsDebug assembleUniversalGmsDebugAndroidTest 2>&1 | tee "$RUNNER_TEMP/ft-feature-build.log"
      - name: Summarize a build failure
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          log = Path(os.environ['RUNNER_TEMP']) / 'ft-feature-build.log'
          if log.exists():
              text = re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', log.read_text(errors='replace'))
              compiler_errors = '\n'.join(re.findall(r'(?m)^e: .+$', text)[:30])
              start = max(text.rfind('FAILURE:'), text.rfind('* What went wrong:'))
              text = (text[start:] if start >= 0 else text[-7000:])[:7000]
              text = ((compiler_errors + '\n') if compiler_errors else '') + text
              print('::error title=Feature build failure::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ft-debug-and-test-apks
          path: |
            android/app/build/outputs/apk/universalGms/debug/*.apk
            android/app/build/outputs/apk/androidTest/universalGms/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  emulator:
    needs: build-debug
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [28, 29, 35]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ft-debug-and-test-apks
          path: ${{ runner.temp }}/ft-apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise offline downloads and local deletion on Android ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          FT_TEST_API: ${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash android/tests/run-feature-emulator.sh
      - name: Summarize an emulator failure
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          root = Path(os.environ['RUNNER_TEMP'])
          names = ('instrumentation.log', 'local-delete-smoke.log', 'ui-smoke.log')
          # A raw tail is useless here: the instrumentation log is verbose status blocks and the
          # interesting lines sit in the middle, so an annotation limit truncates them away. Report
          # the verdict, the failing test names and their stack traces instead.
          interesting = re.compile(
              r'FAILURES!!|^Failures:|^Tests run:|^OK \(|INSTRUMENTATION_FAILED'
              r'|INSTRUMENTATION_RESULT|INSTRUMENTATION_ABORTED'
              r'|^INSTRUMENTATION_STATUS: stack='
              r'|^INSTRUMENTATION_STATUS_CODE: -'
              r'|^[A-Za-z0-9_.]*(Exception|Error|Failure)\b|^\tat |shortMsg|longMsg'
              r'|Traceback|AssertionError|No such|not found|Trace|did not|expected')
          parts = []
          for name in names:
              path = root / name
              if not path.exists():
                  parts.append('== %s: MISSING ==' % name)
                  continue
              lines = path.read_text(errors='replace').splitlines()
              hits = [i for i, line in enumerate(lines) if interesting.search(line)]
              # Keep the lines around each hit so a failure carries its test and class name, which
              # sit a few lines above the stack trace in instrumentation output.
              window = sorted({j for i in hits for j in range(max(0, i - 6), min(len(lines), i + 3))})
              kept = [lines[i] for i in window[:400]]
              parts.append('== %s: %d lines, %d hits, their context, then the last 20 ==' % (name, len(lines), len(hits)))
              parts.extend(kept)
              parts.extend(lines[-20:])
          text = '\n'.join(parts)[-6000:]
          if text:
              print('::error title=Emulator feature check failed::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: ft-feature-emulator-${{ matrix.api }}
          path: |
            ${{ runner.temp }}/instrumentation.log
            ${{ runner.temp }}/local-delete-smoke.log
            ${{ runner.temp }}/ft-local-delete-ui/
            ${{ runner.temp }}/ft-ui/
          if-no-files-found: ignore
          retention-days: 7
