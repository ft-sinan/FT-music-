# One-time owner-approved v0.6 staging. Remove this workflow before merging.
# The signing runner uses only reviewed scripts and pinned, previously checked
# artifacts; it does not run Gradle or import any application code.
name: Temporary v0.6 signed upgrade and staging
on:
  push:
    branches: [arena/ec4653dd-ft-music]
    paths: [.github/workflows/temp-v06-staging.yml]

permissions:
  contents: read
  actions: read

jobs:
  sign:
    if: github.repository == 'ft-sinan/FT-music-' && github.ref == 'refs/heads/arena/ec4653dd-ft-music'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: e6532d8d7d7b48e97bb4d8f010cc0026935deadb
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify the pinned architecture build succeeded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/41301507044" --jq '[.head_sha,.status,.conclusion] | @tsv' > "$RUNNER_TEMP/checked-run.txt"
          printf 'e6532d8d7d7b48e97bb4d8f010cc0026935deadb\tcompleted\tsuccess\n' | cmp - "$RUNNER_TEMP/checked-run.txt"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: ft-unsigned-*
          path: ${{ runner.temp }}/ft-unsigned
          run-id: 41301507044
          github-token: ${{ github.token }}
      - name: Ensure Android signing tools are present
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"'
      - name: Verify and sign the five APKs on an isolated runner
        env:
          FT_MUSIC_KEY_PASSPHRASE: ${{ secrets.FT_MUSIC_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          [[ "$(python3 android/scripts/release-version.py)" == '0.6.0' ]]
          mapfile -t reference < <(find "$RUNNER_TEMP/ft-unsigned/ft-unsigned-universal" -maxdepth 1 -name '*-unsigned.apk' -type f)
          [[ ${#reference[@]} == 1 ]]
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            mapfile -t files < <(find "$RUNNER_TEMP/ft-unsigned/ft-unsigned-$abi" -maxdepth 1 -name '*-unsigned.apk' -type f)
            [[ ${#files[@]} == 1 ]]
            python3 android/scripts/verify-apk-abi.py "${files[0]}" "$abi" --reference "${reference[0]}"
          done
          umask 077
          KEY_DIR=$(mktemp -d "$RUNNER_TEMP/ft-signing.XXXXXXXX")
          trap 'rm -rf "$KEY_DIR"' EXIT
          android/scripts/unseal-signing.sh "$KEY_DIR"
          for abi in universal arm64-v8a armeabi-v7a x86 x86_64; do
            mapfile -t files < <(find "$RUNNER_TEMP/ft-unsigned/ft-unsigned-$abi" -maxdepth 1 -name '*-unsigned.apk' -type f)
            [[ ${#files[@]} == 1 ]]
            FT_APK_ABI="$abi" FT_UNSIGNED_APK="${files[0]}" android/scripts/sign-release.sh "$KEY_DIR/temp-key.pk8" "$KEY_DIR/temp-cert.der" "$RUNNER_TEMP/ft-signed"
          done
          (cd "$RUNNER_TEMP/ft-signed" && sha256sum ./*.apk | sed 's|  ./|  |' > SHA256SUMS.txt)
          while read -r hash filename; do echo "::notice title=SIGNED_APK_SHA256::$filename $hash"; done < "$RUNNER_TEMP/ft-signed/SHA256SUMS.txt"
          du -h "$RUNNER_TEMP"/ft-signed/*.apk
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ft-v0.6.0-signed
          path: ${{ runner.temp }}/ft-signed/
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  upgrade:
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 28, first: x86_64, second: universal }
          - { api: 29, first: x86_64, second: universal }
          - { api: 35, first: universal, second: x86_64 }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: e6532d8d7d7b48e97bb4d8f010cc0026935deadb
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ft-v0.6.0-signed
          path: ${{ runner.temp }}/new
      - name: Fetch the published v0.5 APK and check signatures and hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/old"
          gh release download v0.5.0 --repo "$GITHUB_REPOSITORY" --pattern 'FT-Music-v0.5.0.apk' --dir "$RUNNER_TEMP/old"
          echo 'db186e13888ce2112842fe83074e6867eadc6216ba97e3894af0b8c388dc5a69  '"$RUNNER_TEMP/old/FT-Music-v0.5.0.apk" | sha256sum -c -
          (cd "$RUNNER_TEMP/new" && sha256sum -c SHA256SUMS.txt)
          expected=$(tr -d '[:space:]' < android/signing-cert-sha256.txt)
          for apk in "$RUNNER_TEMP"/old/*.apk "$RUNNER_TEMP"/new/*.apk; do
            cert=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            [[ "$cert" == "$expected" ]] || { echo "Signing certificate mismatch: $apk" >&2; exit 1; }
          done
      - name: Prepare synthetic upgrade and post-upgrade deletion checks
        run: |
          cat > "$RUNNER_TEMP/run-signed-upgrade.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          adb shell svc wifi disable
          adb shell svc data disable
          python3 android/tests/SignedUpgradeSmoke.py 2>&1 | tee "$RUNNER_TEMP/signed-upgrade.log"
          FT_TEST_KEEP_DATA=1 python3 android/tests/LocalDeleteUiSmoke.py 2>&1 | tee "$RUNNER_TEMP/signed-local-delete.log"
          SCRIPT
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check signed in-place upgrade and actual-file deletion on API ${{ matrix.api }}
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          FT_OLD_APK: ${{ runner.temp }}/old/FT-Music-v0.5.0.apk
          FT_FIRST_APK: ${{ runner.temp }}/new/FT-Music-v0.6.0-${{ matrix.first }}.apk
          FT_SECOND_APK: ${{ runner.temp }}/new/FT-Music-v0.6.0-${{ matrix.second }}.apk
          ANDROID_UI_OUTPUT: ${{ runner.temp }}/signed-upgrade-output
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash "$RUNNER_TEMP/run-signed-upgrade.sh"
      - name: Summarize upgrade failures
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ['RUNNER_TEMP'])
          text = '\n'.join((root / name).read_text(errors='replace')[-5000:]
                           for name in ('signed-upgrade.log', 'signed-local-delete.log') if (root / name).exists())
          if text:
              print('::error title=Signed upgrade check failed::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: ft-signed-upgrade-${{ matrix.api }}
          path: |
            ${{ runner.temp }}/signed-upgrade.log
            ${{ runner.temp }}/signed-local-delete.log
            ${{ runner.temp }}/signed-upgrade-output/
          if-no-files-found: ignore
          retention-days: 3

  stage_release:
    needs: [sign, upgrade]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: e6532d8d7d7b48e97bb4d8f010cc0026935deadb
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ft-v0.6.0-signed
          path: ${{ runner.temp }}/ft-signed
      - name: Stage the approved pre-release for publication after review and merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'ft-sinan/FT-music-' && "$GITHUB_REF" == 'refs/heads/arena/ec4653dd-ft-music' ]]
          [[ -z "$(git ls-remote --tags origin refs/tags/v0.6.0)" ]] || { echo 'v0.6.0 tag already exists' >&2; exit 1; }
          (cd "$RUNNER_TEMP/ft-signed" && sha256sum -c SHA256SUMS.txt)
          gh release create v0.6.0 \
            "$RUNNER_TEMP/ft-signed/FT-Music-v0.6.0-universal.apk" \
            "$RUNNER_TEMP/ft-signed/FT-Music-v0.6.0-arm64-v8a.apk" \
            "$RUNNER_TEMP/ft-signed/FT-Music-v0.6.0-armeabi-v7a.apk" \
            "$RUNNER_TEMP/ft-signed/FT-Music-v0.6.0-x86.apk" \
            "$RUNNER_TEMP/ft-signed/FT-Music-v0.6.0-x86_64.apk" \
            "$RUNNER_TEMP/ft-signed/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" --draft --prerelease \
            --target e6532d8d7d7b48e97bb4d8f010cc0026935deadb \
            --title 'FT Music v0.6.0' --notes-file .github/release-notes.md
