# Temporary emulator check of the verified unsigned APK. Remove after review.
name: Temporary FT Music emulator smoke
on:
  push:
    branches: [arena/3c1c13cb-ft-music]
    paths: [.github/workflows/temp-echo-ui.yml]

permissions:
  actions: read
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ft-music-unsigned-apk
          path: ${{ runner.temp }}/ft-unsigned
          run-id: 41048277856
          github-token: ${{ github.token }}
      - name: Sign the test APK with an ephemeral emulator-only key
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find "$RUNNER_TEMP/ft-unsigned" -maxdepth 1 -name '*-unsigned.apk' -type f)
          [[ ${#FILES[@]} == 1 ]]
          keytool -genkeypair -keystore "$RUNNER_TEMP/test.jks" -storepass android -keypass android -alias test -dname 'CN=FT Music emulator test' -keyalg RSA -validity 7
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "${FILES[0]}" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/test.jks" --ks-pass pass:android --key-pass pass:android --ks-key-alias test --out "$RUNNER_TEMP/ft-test.apk" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$RUNNER_TEMP/ft-test.apk"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Scroll the earlier build's welcome dialog before testing
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('android/tests/UiSmoke.py')
          s = p.read_text()
          s = s.replace('welcome = wait_for("Continue")', 'welcome = wait_for("FT Music")\n        adb("shell", "input", "swipe", "540", "1550", "540", "400", "600")\n        time.sleep(1)\n        adb("shell", "input", "swipe", "540", "1550", "540", "400", "600")\n        time.sleep(2)')
          p.write_text(s)
          PYCODE
      - name: Run FT Music emulator smoke
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          FT_TEST_APK: ${{ runner.temp }}/ft-test.apk
          ANDROID_UI_OUTPUT: ${{ runner.temp }}/ft-ui
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash -o pipefail -c 'python3 android/tests/UiSmoke.py 2>&1 | tee "$RUNNER_TEMP/ft-ui-log.txt" && python3 .github/ft-playback-probe.py 2>&1 | tee "$RUNNER_TEMP/ft-playback-log.txt"'
      - name: Make temporary screenshots and diagnostics reviewable
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for item in "$RUNNER_TEMP"/ft-ui/*.png "$RUNNER_TEMP"/ft-ui/*.xml "$RUNNER_TEMP"/ft-ui/*.txt "$RUNNER_TEMP"/ft-ui-log.txt; do
            [[ -f "$item" ]] || continue
            name=$(basename "$item" | tr '[:lower:].-' '[:upper:]__')
            python3 - "$item" > "$RUNNER_TEMP/blob.json" <<'PY'
          import base64, json, sys
          with open(sys.argv[1], 'rb') as f:
              json.dump({'content': base64.b64encode(f.read()).decode(), 'encoding': 'base64'}, sys.stdout)
          PY
            sha=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input "$RUNNER_TEMP/blob.json" --jq .sha)
            echo "::notice title=FT_UI_$name::$sha"
          done
