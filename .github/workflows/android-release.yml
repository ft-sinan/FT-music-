name: Publish Android release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark this release as a pre-release
        type: boolean
        required: true
        default: true

permissions:
  contents: read

jobs:
  build:
    # Each package is built and compared without the FT signing passphrase.
    uses: ./.github/workflows/android-abi-checks.yml

  sign_and_publish:
    # Fresh runner: Gradle and third-party build plugins never see the signing key.
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: ft-unsigned-*
          path: ${{ runner.temp }}/ft-unsigned
      - name: Install signing tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"'
      - name: Validate version against existing releases
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'ft-sinan/FT-music-' && "$GITHUB_REF" == 'refs/heads/main' ]] || { echo 'Release only from reviewed main.' >&2; exit 1; }
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' > "$RUNNER_TEMP/ft-existing-tags.txt"
          VERSION=$(python3 android/scripts/release-version.py --existing-tags "$RUNNER_TEMP/ft-existing-tags.txt")
          TAG="v$VERSION"
          [[ -z "$(git ls-remote --tags origin "refs/tags/$TAG")" ]] || { echo "Tag $TAG already exists." >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Unseal and sign each package with the protected signing key
        env:
          FT_MUSIC_KEY_PASSPHRASE: ${{ secrets.FT_MUSIC_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          KEY_DIR=$(mktemp -d "$RUNNER_TEMP/ft-signing.XXXXXXXX")
          trap 'rm -rf "$KEY_DIR"' EXIT
          android/scripts/unseal-signing.sh "$KEY_DIR"
          for abi in universal arm64-v8a armeabi-v7a x86 x86_64; do
            mapfile -t files < <(find "$RUNNER_TEMP/ft-unsigned/ft-unsigned-$abi" -maxdepth 1 -name '*-unsigned.apk' -type f)
            [[ ${#files[@]} == 1 ]] || { echo "Expected one unsigned $abi APK." >&2; exit 1; }
            FT_APK_ABI="$abi" FT_UNSIGNED_APK="${files[0]}" android/scripts/sign-release.sh "$KEY_DIR/temp-key.pk8" "$KEY_DIR/temp-cert.der" "$RUNNER_TEMP/ft-release"
          done
          (cd "$RUNNER_TEMP/ft-release" && sha256sum ./*.apk | sed 's|  ./|  |' > SHA256SUMS.txt)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          args=("$TAG" "$RUNNER_TEMP/ft-release/FT-Music-$TAG-universal.apk" "$RUNNER_TEMP/ft-release/FT-Music-$TAG-arm64-v8a.apk" "$RUNNER_TEMP/ft-release/FT-Music-$TAG-armeabi-v7a.apk" "$RUNNER_TEMP/ft-release/FT-Music-$TAG-x86.apk" "$RUNNER_TEMP/ft-release/FT-Music-$TAG-x86_64.apk" "$RUNNER_TEMP/ft-release/SHA256SUMS.txt" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "FT Music $TAG" --notes-file .github/release-notes.md)
          if [[ "$PRERELEASE" == "true" ]]; then args+=(--prerelease); fi
          gh release create "${args[@]}"
