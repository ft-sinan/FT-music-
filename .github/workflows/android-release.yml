name: Publish Android release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark this release as a pre-release
        type: boolean
        required: true
        default: true

permissions:
  contents: read

jobs:
  build:
    # The build runs without access to the FT signing passphrase.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Require a reviewed main-branch build
        run: |
          [[ "$GITHUB_REPOSITORY" == 'ft-sinan/FT-music-' && "$GITHUB_REF" == 'refs/heads/main' ]] || { echo 'Release only from reviewed main.' >&2; exit 1; }
      - name: Install Android SDK and native tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"'
      - name: Test and build an unsigned release
        working-directory: android
        run: ./gradlew --no-daemon testUniversalGmsDebugUnitTest assembleUniversalGmsRelease
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ft-unsigned-release
          path: android/app/build/outputs/apk/universalGms/release/*-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  sign_and_publish:
    # Fresh runner: Gradle and third-party build plugins never see the signing key.
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ft-unsigned-release
          path: ${{ runner.temp }}/ft-unsigned
      - name: Install signing tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"'
      - name: Validate version against existing releases
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'ft-sinan/FT-music-' && "$GITHUB_REF" == 'refs/heads/main' ]] || { echo 'Release only from reviewed main.' >&2; exit 1; }
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' > "$RUNNER_TEMP/ft-existing-tags.txt"
          VERSION=$(python3 android/scripts/release-version.py --existing-tags "$RUNNER_TEMP/ft-existing-tags.txt")
          TAG="v$VERSION"
          [[ -z "$(git ls-remote --tags origin "refs/tags/$TAG")" ]] || { echo "Tag $TAG already exists." >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Unseal and sign with the protected signing key
        env:
          FT_MUSIC_KEY_PASSPHRASE: ${{ secrets.FT_MUSIC_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find "$RUNNER_TEMP/ft-unsigned" -maxdepth 1 -name '*-unsigned.apk' -type f)
          [[ ${#FILES[@]} == 1 ]] || { echo 'Expected exactly one unsigned APK.' >&2; exit 1; }
          export FT_UNSIGNED_APK="${FILES[0]}"
          umask 077
          KEY_DIR=$(mktemp -d "$RUNNER_TEMP/ft-signing.XXXXXXXX")
          trap 'rm -rf "$KEY_DIR"' EXIT
          android/scripts/unseal-signing.sh "$KEY_DIR"
          android/scripts/sign-release.sh "$KEY_DIR/temp-key.pk8" "$KEY_DIR/temp-cert.der" "$RUNNER_TEMP/ft-release"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/ft-release/FT-Music-$TAG.apk"
          args=("$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "FT Music $TAG" --notes-file .github/release-notes.md)
          if [[ "$PRERELEASE" == "true" ]]; then args+=(--prerelease); fi
          gh release create "${args[@]}"
