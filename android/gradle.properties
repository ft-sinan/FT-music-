android.useAndroidX=true
android.newDsl=false
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g


# Flow Neuroengine
FLOW_NEURO_BASE_URL=https://api.flowneuroengine.com
FLOW_NEURO_API_KEY=dummy_key
android.useFullClasspathForDexingTransform=true
android.suppressUnsupportedCompileSdk=37,37.0

# Bound memory and parallel work for the GitHub-hosted Android builder.
org.gradle.workers.max=2
org.gradle.parallel=false
